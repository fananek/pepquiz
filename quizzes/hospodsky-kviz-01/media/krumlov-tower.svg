  <polygon points="384,64 400,32 416,64" fill="#047857"/>
  <!-- Town roofs -->
  <polygon points="210,275 265,230 320,275" fill="#b91c1c"/>
  <polygon points="480,270 535,225 590,270" fill="#b91c1c"/>
</svg>
