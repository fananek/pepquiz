<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Stylizovaná věž zámku nad meandrem řeky">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dusk)"/>
  <!-- River meander -->
  <path d="M0 365 Q200 325 400 365 T800 355 L800 450 L0 450 Z" fill="#1d4ed8" opacity="0.75"/>
  <!-- Cliff and castle silhouettes -->
  <path d="M120 350 L185 260 L570 250 L650 355 Z" fill="#1e293b"/>
