  <rect x="355" y="135" width="90" height="140" fill="#fde68a" stroke="#1e293b" stroke-width="4"/>
  <!-- Arcade gallery -->
  <rect x="345" y="122" width="110" height="22" rx="4" fill="#dc2626"/>
  <path d="M352 122 Q400 72 448 122 Z" fill="#047857"/>
  <!-- Lantern dome -->
